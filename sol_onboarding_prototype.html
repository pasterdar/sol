<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sol onboarding prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --dawn:#FAF7F1; --cream:#fff; --cocoa:#1F1F1F; --clay:#9E9A94;
  --peach:#E6C98B; --coral:#FF8A65; --gold:#F5B800; --sage:#8FA87A;
  --coralText:#FF8A65; --sageText:#8FA87A; --goldText:#F5B800;
  --hair:#E6E4DF;
  /* Secondary text tier. Not an eleventh colour: this is the locked ink at 65%,
     which measures 4.98:1 on dawn, 5.17:1 on white and 4.95:1 on butter — the
     lightest it can go and still clear AA on every surface it lands on. */
  --soft:rgba(31,31,31,.65);
  /* --clay is decoration only: grab handles, field icons, picker chrome.
     It never carries text. */
  /* --blue: permitted ONLY inside the simulated iOS dialog. The dialog's own
     system greys and third-party sign-in marks are likewise exempt. */
  --blue:#007AFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1F1F1F;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;color:var(--cocoa);padding:24px;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:disabled{cursor:default;}
input{font-family:inherit;}

.phone{width:390px;height:800px;background:var(--dawn);border-radius:46px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(31,31,31,.55),0 0 0 10px #1F1F1F;}

/* progress header */
.prog{padding:22px 22px 0;display:flex;align-items:center;gap:14px;}
.prog .bk{font-size:26px;line-height:1;width:44px;height:44px;margin-inline-start:-10px;display:flex;align-items:center;
  color:var(--cocoa);font-weight:300;flex-shrink:0;}
.prog .track{flex:1;height:4px;border-radius:99px;background:#E6E4DF;}
.prog .fill{height:100%;border-radius:99px;background:var(--gold);transition:width .45s cubic-bezier(.2,.8,.3,1);}

.body{flex:1;overflow-y:auto;padding:10px 26px 0;display:flex;flex-direction:column;}
.footer{padding:14px 26px 30px;}

h1.hd{font-size:32px;font-weight:700;letter-spacing:-.022em;line-height:1.16;}
h1,p{text-wrap:balance;}
p.lead{font-size:16px;color:var(--soft);margin-top:8px;line-height:1.5;}

.primary{width:100%;padding:16px 0;border-radius:12px;background:var(--sage);color:var(--cocoa);
  font-size:17px;font-weight:600;transition:all .25s cubic-bezier(.2,.8,.3,1);}
/* disabled label stays readable: ink at .7 over #E6E4DF measures 5.42:1 */
.primary:disabled{background:#E6E4DF;color:var(--cocoa);opacity:.7;}
.ghostbtn{width:100%;padding:12px 0;border-radius:12px;background:transparent;color:var(--cocoa);
  font-size:16px;font-weight:400;margin-top:6px;}

/* option rows */
.opt{width:100%;text-align:start;padding:14px 15px;border-radius:12px;border:1.5px solid var(--hair);
  background:var(--cream);display:flex;align-items:center;gap:13px;transition:all .25s ease;}
.opt.sel{border-color:var(--gold);background:#FFF3C4;}
.opt .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt .tx{flex:1;}
.opt .tx b{display:block;font-size:16px;font-weight:600;}
/* balance so a two-line description never strands one word on line two */
.opt .tx small{display:block;font-size:13px;color:var(--soft);margin-top:2px;text-wrap:balance;}
/* one control per meaning: .radio.one = choose one (goal),
   .radio = choose several (activity, habit stack). */
.radio{width:22px;height:22px;border-radius:6px;flex-shrink:0;border:1.5px solid var(--hair);
  display:flex;align-items:center;justify-content:center;background:transparent;transition:all .2s ease;}
.radio.one{border-radius:50%;}
.radio.on,.opt.sel .radio{border-color:var(--goldText);background:var(--gold);}


/* animations */
@keyframes swayF{0%,100%{transform:rotate(-2.6deg);}50%{transform:rotate(2.6deg);}}
@keyframes swayB{0%,100%{transform:rotate(2.6deg);}50%{transform:rotate(-2.6deg);}}
.sw-f{animation:swayF 4.4s ease-in-out infinite;transform-origin:center;}
.sw-b{animation:swayB 5.8s ease-in-out infinite;transform-origin:center;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.3,1) both;}
@keyframes bloomScale{0%{transform:scale(.2) rotate(-25deg);opacity:0;}55%{opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.bloom-scale{transform-origin:center;animation:bloomScale 1.5s cubic-bezier(.34,1.15,.5,1) both;}
@keyframes petalFade{from{opacity:0;}to{opacity:var(--o,1);}}
.bloom-petal{opacity:0;animation:petalFade .7s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.bloom-center{animation:fadeIn .8s ease .85s both;}
@keyframes gentleSway{0%,100%{transform:rotate(-2.4deg);}50%{transform:rotate(2.4deg);}}
.bloom-wrap{animation:gentleSway 5.2s ease-in-out 1.8s infinite;transform-origin:center;}
.done-text{animation:rise .8s cubic-bezier(.2,.8,.3,1) 1.3s both;}
@media (prefers-reduced-motion:reduce){.sw-f,.sw-b,.rise,.bloom-scale,.bloom-petal,.bloom-center,.bloom-wrap,.done-text{animation:none!important;opacity:1;}}

.k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--soft);}

/* form fields */
.fieldrow{position:relative;margin-bottom:14px;}
.field{width:100%;padding:15px 16px;border-radius:12px;font-size:15px;border:1.5px solid var(--hair);
  background:var(--cream);color:var(--cocoa);outline:none;transition:border-color .2s ease;}
.field:focus{border-color:var(--gold);}
.field::placeholder{color:var(--soft);}
.reveal{position:absolute;inset-inline-end:8px;top:11px;font-size:13px;font-weight:700;color:var(--cocoa);padding:8px 8px;}
/* the palette has no error colour, so a failed field speaks in ink, and the
   disabled button carries the rest of the signal */
.fieldmsg{font-size:12px;line-height:1.4;margin:6px 4px 0;color:var(--soft);}
.fieldmsg.bad{color:var(--cocoa);font-weight:600;}
/* layout is direction-neutral; glyphs that point get mirrored */
.prog .bk:dir(rtl){transform:scaleX(-1);}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--cream);border:1px solid var(--hair);border-radius:12px;font-size:16px;font-weight:600;}
.timerow input{font:inherit;font-size:17px;font-weight:700;color:var(--cocoa);background:#FFF3C4;border:1.5px solid var(--gold);border-radius:9px;padding:6px 10px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div class="phone" id="phone"></div>

<script>
/* ============ icons (from the source design system, no emojis) ============ */
function GI(o,size){
  size=size||22;
  if(o&&o.emoji)return '<span style="font-size:'+Math.round(size*1.05)+'px;line-height:1;display:inline-block">'+o.emoji+'</span>';
  return I(o.icon,o.hue,size);
}
function I(name,c,s){
  c=c||'#1F1F1F';s=s||22;
  const P='fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const d={
    moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z" '+P+'/>',
    run:'<g '+P+'><circle cx="13" cy="4" r="2"/><path d="M13 8l-3 3 1 4-2 4M10 11l-4 1M14 12l3 1 1 4"/></g>',
    dumbbell:'<g '+P+'><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></g>',
    wave:'<g '+P+'><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></g>',

    edit:'<g '+P+'><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 7l4 4"/></g>',
    clock:'<g '+P+'><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></g>',
    candle:'<g '+P+'><path d="M12 3c1.5 1.5 1.5 3 0 4-1.5-1-1.5-2.5 0-4z"/><rect x="9.5" y="8" width="5" height="11" rx="1.4"/></g>',
    cup:'<g '+P+'><path d="M5 8h11v5a4 4 0 01-4 4H9a4 4 0 01-4-4z"/><path d="M16 9h2a2 2 0 010 4h-2"/></g>',
    walk:'<g '+P+'><circle cx="13" cy="4.5" r="1.8"/><path d="M13 8l-2 4 2 2 1 5M11 12l-3 1M13 14l2 4"/></g>',
    sun:'<g '+P+'><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></g>',
    laptop:'<g '+P+'><rect x="5" y="5" width="14" height="9" rx="1.4"/><path d="M3 18h18"/></g>',
    plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round"/>',
    calendar:'<g '+P+'><rect x="4" y="5" width="16" height="16" rx="2.4"/><path d="M4 9h16M8 3v4M16 3v4"/></g>',
    breath:'<g '+P+'><circle cx="12" cy="12" r="3"/><path d="M12 9c0-3 4-4 4-1M12 15c0 3 4 4 4 1M9 12c-3 0-4-4-1-4M15 12c3 0 4 4 1 4"/></g>',
    pen:'<g '+P+'><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 7l4 4"/></g>',
    mail:'<g '+P+'><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></g>',
    check:'<path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    heart:'<path d="M12 20s-7-4.5-9-9c-1.3-3 .5-6 3.5-6 2 0 3.5 1.5 5.5 4 2-2.5 3.5-4 5.5-4 3 0 4.8 3 3.5 6-2 4.5-9 9-9 9z" '+P+'/>',
    shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z" '+P+'/>',
    bell:'<path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6zM10 20a2 2 0 004 0" '+P+'/>',
    lock:'<g '+P+'><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></g>',
    search:'<g '+P+'><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></g>',
    apple:'<g fill="'+c+'"><path d="M16.3 12.9c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.15-2.8.85-3.5.85-.7 0-1.85-.83-3-.81-1.55.02-3 .9-3.8 2.3-1.6 2.8-.4 7 1.15 9.3.77 1.13 1.68 2.4 2.87 2.35 1.15-.05 1.6-.74 3-.74s1.8.74 3 .72c1.24-.02 2.02-1.15 2.78-2.28.87-1.3 1.23-2.57 1.25-2.64-.03-.01-2.4-.92-2.4-3.66z"/><path d="M14.1 6.2c.63-.77 1.06-1.83.94-2.9-.91.04-2.01.61-2.66 1.37-.58.68-1.1 1.76-.96 2.8 1.02.08 2.05-.52 2.68-1.27z"/></g>',
  };
  return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" aria-hidden="true">'+(d[name]||'')+'</svg>';
}

/* ============ flower renderers ============ */
function logoFlower(size){
  const petals=16;let back='',front='';
  for(let i=0;i<petals;i++){
    back+='<ellipse cx="0" cy="-38" rx="8" ry="21" transform="rotate('+((i*360/petals)+11.25)+')" fill="url(#gp)" opacity=".5"/>';
    front+='<ellipse cx="0" cy="-38" rx="8.5" ry="22" transform="rotate('+(i*360/petals)+')" fill="url(#gp)" opacity=".96" stroke="rgba(255,255,255,.4)" stroke-width=".5"/>';
  }
  let seeds='';
  for(let i=0;i<130;i++){const a=i*137.5*Math.PI/180,r=1.55*Math.sqrt(i);if(r>19)continue;const t=r/19;
    seeds+='<circle cx="'+(Math.cos(a)*r).toFixed(2)+'" cy="'+(Math.sin(a)*r).toFixed(2)+'" r="'+(1.2-t*.4).toFixed(2)+'" fill="'+(t<.5?'#E7B24A':'#7A4E1C')+'" opacity=".55"/>';}
  return '<svg viewBox="-60 -60 120 120" width="'+size+'" height="'+size+'" aria-label="Sol">'+
    '<defs><linearGradient id="gp" x1="0" y1="-1" x2="0" y2="0.2"><stop offset="0" stop-color="#FFC24D"/><stop offset=".55" stop-color="#FBA425"/><stop offset="1" stop-color="#F2871A"/></linearGradient>'+
    '<radialGradient id="gs" cx="50%" cy="45%" r="58%"><stop offset="0" stop-color="#C99A3A"/><stop offset=".65" stop-color="#9A6A22"/><stop offset="1" stop-color="#5E3B16"/></radialGradient></defs>'+
    '<g class="sw-b">'+back+'</g><g class="sw-f">'+front+'</g><circle cx="0" cy="0" r="21" fill="url(#gs)"/>'+seeds+'</svg>';
}
function bloomFlower(size){
  const petals=16;let back='',front='';
  for(let i=0;i<petals;i++){
    back+='<ellipse class="bloom-petal" style="animation-delay:'+(300+i*50)+'ms;--o:.5" cx="0" cy="-38" rx="8" ry="21" transform="rotate('+((i*360/petals)+11.25)+')" fill="url(#bp)"/>';
    front+='<ellipse class="bloom-petal" style="animation-delay:'+(300+i*50)+'ms;--o:.96" cx="0" cy="-38" rx="8.5" ry="22" transform="rotate('+(i*360/petals)+')" fill="url(#bp)" stroke="rgba(255,255,255,.4)" stroke-width=".5"/>';
  }
  let seeds='';
  for(let i=0;i<130;i++){const a=i*137.5*Math.PI/180,r=1.55*Math.sqrt(i);if(r>19)continue;const t=r/19;
    seeds+='<circle class="bloom-center" cx="'+(Math.cos(a)*r).toFixed(2)+'" cy="'+(Math.sin(a)*r).toFixed(2)+'" r="'+(1.2-t*.4).toFixed(2)+'" fill="'+(t<.5?'#E7B24A':'#7A4E1C')+'" opacity=".55"/>';}
  return '<svg viewBox="-60 -60 120 120" width="'+size+'" height="'+size+'" class="bloom-wrap" aria-label="Sol">'+
    '<defs><linearGradient id="bp" x1="0" y1="-1" x2="0" y2="0.2"><stop offset="0" stop-color="#FFC24D"/><stop offset=".55" stop-color="#FBA425"/><stop offset="1" stop-color="#F2871A"/></linearGradient>'+
    '<radialGradient id="bs" cx="50%" cy="45%" r="58%"><stop offset="0" stop-color="#C99A3A"/><stop offset=".65" stop-color="#9A6A22"/><stop offset="1" stop-color="#5E3B16"/></radialGradient></defs>'+
    '<g class="bloom-scale">'+back+front+'<circle cx="0" cy="0" r="21" fill="url(#bs)" class="bloom-center"/>'+seeds+'</g></svg>';
}

/* ============ data ============ */
const GOALS=[
  {id:'fitness',emoji:'💪🏼',icon:'run',label:'Get stronger',sub:'Pick your activity next',hue:'#FF8A65'},
  {id:'calm',emoji:'🌱',icon:'wave',label:'Feel calmer',sub:'Less stress in your days',hue:'#8FA87A'},
  {id:'sleep',emoji:'🌙',icon:'moon',label:'Sleep better',sub:'Deep, consistent rest',hue:'#6F92A8'},
];
const SPORTS=[
  ['Running','🏃'],['Walking','🚶'],['Strength training','🏋️'],['Cycling','🚴'],['Swimming','🏊'],
  ['Yoga','🧘'],['Pilates','🤸'],['Hiking','🥾'],['Football','⚽'],['Basketball','🏀'],
  ['Tennis','🎾'],['Padel','🎾'],['Boxing','🥊'],['Climbing','🧗'],['Rowing','🚣'],
  ['Dancing','💃'],['Martial arts','🥋'],['Skiing','⛷️'],['Surfing','🏄'],['Golf','⛳'],
  ['Volleyball','🏐'],['CrossFit','🤾']
];
const STACKS={
  sleep:[
    {id:'s1',emoji:'⏰',label:'Consistent wake time',sub:'Same time every day, including weekends',on:true},
    {id:'s2',emoji:'🛏️',label:'Consistent bedtime',sub:'Within about 45 minutes of your target bedtime',on:true},
    {id:'s3',emoji:'📱',label:'Screen free before bed',sub:'No screens for 15 minutes before you sleep',on:true},
    {id:'s4',emoji:'💤',label:'7 hours of sleep',sub:'At least 7 hours a night',on:true},
    {id:'s5',emoji:'☕',label:'Caffeine',sub:'None within 6 hours of your bedtime',on:false},
    {id:'s6',emoji:'🍽️',label:'Last meal',sub:'Finish eating at least 4 hours before bed',on:false},
  ],
  calm:[
    {id:'c1',emoji:'🪷',label:'Breathwork',sub:'In for 4, pause, out for 5.5, for five minutes',on:true},
    {id:'c2',emoji:'✍🏼',label:'Clear your head',sub:'Write down at least 3 things on your mind',on:true},
    {id:'c3',emoji:'📚',label:'Read',sub:'20 minutes with a book',on:true},
    {id:'c4',emoji:'📱',label:'Screen free morning',sub:'No screens for the first 15 minutes after waking',on:false},
    {id:'c5',emoji:'🧘🏼‍♀️',label:'Meditate',sub:'About 10 minutes',on:false},
    {id:'c6',emoji:'💧',label:'Morning water',sub:'A glass of water when you wake up',on:false},
  ],
};
/* The habit library. Onboarding does not offer "add a habit" in V1 — this is
   kept as the source list for the post-onboarding library. Do not delete. */
const ADDABLE=[
  {id:'a-wake',emoji:'⏰',label:'Consistent wake time',sub:'Same time every day, including weekends'},
  {id:'a-bedtime',emoji:'🛏️',label:'Consistent bedtime',sub:'Within about 45 minutes of your target bedtime'},
  {id:'a-nobed',emoji:'📱',label:'Screen free before bed',sub:'No screens for 15 minutes before you sleep'},
  {id:'a-7h',emoji:'💤',label:'7 hours of sleep',sub:'At least 7 hours a night'},
  {id:'a-caffeine',emoji:'☕',label:'Caffeine',sub:'None within 6 hours of your bedtime'},
  {id:'a-meal',emoji:'🍽️',label:'Last meal',sub:'Finish eating at least 4 hours before bed'},
  {id:'a-steps',emoji:'👣',label:'Target steps',sub:'Reach at least 8,000 steps across the day'},
  {id:'a-move',emoji:'🎯',label:'Move your body',sub:'At least 30 minutes, 3 times a week'},
  {id:'a-strength',emoji:'💪🏼',label:'Strength',sub:'At least twice a week'},
  {id:'a-breath',emoji:'🪷',label:'Breathwork',sub:'In for 4, pause, out for 5.5, for five minutes'},
  {id:'a-journal',emoji:'✍🏼',label:'Clear your head',sub:'Write down at least 3 things on your mind'},
  {id:'a-read',emoji:'📚',label:'Read',sub:'20 minutes with a book'},
  {id:'a-nowake',emoji:'📱',label:'Screen free morning',sub:'No screens for the first 15 minutes after waking'},
  {id:'a-meditate',emoji:'🧘🏼‍♀️',label:'Meditate',sub:'About 10 minutes'},
  {id:'a-water',emoji:'💧',label:'Morning water',sub:'A glass of water when you wake up'},
];
/* 'signup' is the email form; Apple and Google skip straight past it, the same
   way 'sport' is skipped for the non-fitness goals. */
const STEPS=['welcome','goal','sport','build','plan','sleeptimes','about','health','notify','account','signup','trial','ready'];
/* The full date of birth is kept, so the age check is exact to the day rather
   than approximate the way a year alone was. Sol is for people 16 and over.
   A younger date can still be entered, so the answer stays honest. */
const MIN_AGE=16;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
function ageFrom(s){
  const b=new Date(s+'T00:00:00'), n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  const m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate()))a--;
  return a;
}
const hasDob=()=>!!S.birthDate;
const ageOk=()=>hasDob()&&ageFrom(S.birthDate)>=MIN_AGE;

/* ============ state ============ */
/* one source of truth for a fresh run, so restart() cannot miss a field */
function defaults(){
  return {
    step:0, goals:[], stack:[], sports:[], sportQuery:'',
    birthDate:null, address:null, bedtime:'23:00', waketime:'07:00', healthOn:false, notifyOn:false, subscribed:false,
    authMethod:null, name:'', email:'', pass:'', showPass:false, marketing:false, touched:{}, busy:false,
  };
}
const S=defaults();

function sportLabel(){
  if(!S.sports||!S.sports.length)return 'Training';
  if(S.sports.length===1)return S.sports[0];
  if(S.sports.length===2)return S.sports[0]+' & '+S.sports[1];
  return S.sports[0]+' +'+(S.sports.length-1)+' more';
}
function fitnessStack(){
  const sp=sportLabel();
  return [
    {id:'f1',emoji:'👣',label:'Target steps',sub:'Reach at least 8,000 steps across the day',on:true},
    {id:'f2',emoji:'🎯',label:'Move your body',sub:'At least 30 minutes, 3 times a week · '+sp,on:true},
    {id:'f3',emoji:'💪🏼',label:'Strength',sub:'At least twice a week',on:true},
  ];
}
/* rebuild is non-destructive: a habit the user already turned on or off keeps
   that choice, so changing an activity no longer discards their edits. */
function rebuildStack(){
  const prev={};
  (S.stack||[]).forEach(h=>{prev[h.id]=h.on;});
  const merged=[];
  S.goals.forEach(gid=>{
    const st = gid==='fitness' ? fitnessStack() : (STACKS[gid]||[]);
    st.forEach(h=>{
      if(merged.some(m=>m.id===h.id))return;
      merged.push({...h, on:(h.id in prev)?prev[h.id]:h.on});
    });
  });
  S.stack=merged;
}
/* one goal only: a second tap replaces the choice, it does not get blocked */
function pickGoal(g){
  S.goals=S.goals.includes(g)?[]:[g];
  if(!S.goals.includes('fitness'))S.sports=[];
  rebuildStack();
  paintGoals();
}
function toggleHabit(hid){const h=S.stack.find(x=>x.id===hid);if(h)h.on=!h.on;paintStack();}
function skipSport(){return !S.goals.includes('fitness');}
/* one rule for every conditional step, used by next, back and the progress bar */
function skipStep(s){
  if(s==='sport')return skipSport();
  if(s==='signup')return S.authMethod!=='email';
  if(s==='sleeptimes')return !sleepTimesNeeded();
  if(s==='trial')return S.authMethod==null;
  return false;
}
function next(){
  let i=S.step+1;
  while(i<STEPS.length-1&&skipStep(STEPS[i]))i++;
  if(i<STEPS.length){S.step=i;render();}
}
function back(){
  clearBuild();
  let i=S.step-1;
  /* 'build' is an animation, never a place to land going backwards */
  while(i>0&&(skipStep(STEPS[i])||STEPS[i]==='build'))i--;
  if(i>=0){S.step=i;render();}
}

/* Apple and Google are simulated: a short pending state, then straight to the
   ready screen. Email gets the real form. Sol has no guest mode: an account is
   how the plan survives a lost phone, and how a subscription is held. */
function authWith(m){
  if(S.busy)return;
  S.authMethod=m;
  if(m==='email'){next();return;}
  S.busy=true;
  const b=document.getElementById(m==='apple'?'authApple':'authGoogle');
  if(b){b.textContent='Connecting…';b.disabled=true;}
  /* if they tapped back while it was pending, do not yank them forward */
  setTimeout(()=>{S.busy=false;if(STEPS[S.step]==='account')next();},900);
}

  S.busy=true;
  const b=document.getElementById('trialBtn');
  if(b){b.textContent='Confirming with the App Store\u2026';b.disabled=true;}
  /* stands in for the App Store purchase sheet */
  setTimeout(()=>{S.busy=false;if(STEPS[S.step]==='trial'){S.subscribed=true;next();}},900);
}
function vReady(){
  const named=S.name.trim()?', '+S.name.trim():'';
  const sub=S.subscribed?'Your account is set and your free week has started.':'Your account is set and your plan is saved.';
  return '<div class="body" style="justify-content:center;align-items:center;text-align:center">'+
    bloomFlower(130)+
    '<h1 class="done-text" style="font-size:29px;font-weight:700;letter-spacing:-.02em;margin-top:16px">You\'re in'+esc(named)+'</h1>'+
    '<p class="done-text" style="font-size:14.5px;color:var(--soft);line-height:1.5;margin-top:8px;max-width:30ch">'+sub+'</p>'+
    '<p class="done-text" style="font-size:14.5px;color:var(--soft);line-height:1.5;margin-top:4px">'+plural(activeCount(),'habit')+', starting today.</p>'+
    '<div class="done-text" style="width:100%;margin-top:26px">'+
      '<button class="primary" onclick="stub(\'Continues in the Sol app prototype.\')">Open Sol</button>'+
      '<p id="doneNote" style="font-size:12px;color:var(--soft);font-weight:600;margin-top:10px;line-height:1.4;min-height:16px"></p>'+
    '</div>'+
  '</div>'+
  '<div class="footer"><button class="ghostbtn" style="font-size:14.5px" onclick="restart()">Restart demo</button></div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function restart(){Object.assign(S,defaults());render();}

/* ============ render ============ */
const GOALWORD={sleep:'better sleep',fitness:'strength',calm:'calm'};
/* the goal word, never the activity name: "running +4 more" read as broken */
function buildBeats(){
  const w=GOALWORD[S.goals[0]];
  return [w?'Reading your goal, '+w:'Reading your goal',
    'Choosing habits backed by science','Setting a gentle starting point','Shaping it around your week'];
}
function vBuild(){
  const rows=buildBeats().map((b)=>
    '<div class="build-row" style="opacity:0;transform:translateY(5px);transition:opacity .35s ease,transform .35s ease;display:flex;align-items:center;gap:12px">'+
      '<span class="build-ck" style="width:23px;height:23px;border-radius:6px;flex-shrink:0;border:1.5px solid var(--hair);display:flex;align-items:center;justify-content:center;transition:all .3s ease">'+
        '<svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#1F1F1F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"/></svg>'+
      '</span>'+
      '<span style="font-size:15.5px;font-weight:600;color:var(--cocoa);line-height:1.35;text-wrap:balance">'+b+'</span>'+
    '</div>').join('');
  return '<div class="body" style="justify-content:center">'+
    '<div style="width:100%;max-width:320px;margin:0 auto;display:flex;flex-direction:column;gap:17px">'+
      '<div style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:center;margin-bottom:4px">Building your plan</div>'+
      rows+
    '</div>'+
  '</div>'+
  '<div class="footer"></div>';
}
let buildTimers=[];
function clearBuild(){buildTimers.forEach(clearTimeout);buildTimers=[];}
function finishBuild(){if(STEPS[S.step]!=='build')return;clearBuild();S.step=STEPS.indexOf('plan');render();}
function startBuild(){
  clearBuild();
  const rows=Array.prototype.slice.call(document.querySelectorAll('.build-row'));
  const STEP=680,CHECK=520,END=480;
  rows.forEach((row,i)=>{
    buildTimers.push(setTimeout(function(){row.style.opacity='1';row.style.transform='none';},i*STEP));
    buildTimers.push(setTimeout(function(){
      const ck=row.querySelector('.build-ck');if(ck){ck.style.background='var(--sage)';ck.style.borderColor='var(--sage)';}
      const path=row.querySelector('path');if(path)path.style.opacity='1';
    },i*STEP+CHECK));
  });
  buildTimers.push(setTimeout(finishBuild,(rows.length-1)*STEP+CHECK+END));
}

function sportRows(){
  const q=(S.sportQuery||'').trim().toLowerCase();
  const list=SPORTS.filter(sp=>sp[0].toLowerCase().indexOf(q)>-1);
  if(!list.length)return '<div style="text-align:center;color:var(--soft);font-size:14px;padding:22px 0;line-height:1.5">No match. Sol can still build around movement in general.</div>';
  return list.map(item=>{
    const sp=item[0], ic=item[1];
    const on=S.sports.indexOf(sp)>-1;
    const full=!on&&S.sports.length>=MAX_SPORTS;
    /* aria-disabled, not disabled: the row must still take the tap so it can
       explain why nothing happened. */
    return '<button onclick="setSport(\''+sp.replace(/'/g,"\\'")+'\')" role="checkbox" aria-checked="'+on+'" aria-disabled="'+full+'" style="width:100%;text-align:start;display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;opacity:'+(full?.45:1)+';font-family:inherit;transition:all .2s ease;border:1.5px solid '+(on?'var(--gold)':'var(--hair)')+';background:'+(on?'#FFF3C4':'var(--cream)')+'">'+
      '<span style="font-size:20px;width:26px;text-align:center;flex-shrink:0">'+ic+'</span>'+
      '<span style="flex:1;font-size:15px;font-weight:600;color:var(--cocoa)">'+sp+'</span>'+
      '<span class="radio'+(on?' on':'')+'">'+(on?I('check','#1F1F1F',13):'')+'</span>'+
    '</button>';
  }).join('');
}
function filterSports(v){
  S.sportQuery=v;
  const box=document.getElementById('sportList');
  if(box)box.innerHTML=sportRows();
}
const MAX_SPORTS=5;
const SPORT_LEAD='Pick up to five you want to build around. You can change them later.';
let sportHintT=null;
function sportHint(){
  const el=document.getElementById('sportLead');
  if(!el)return;
  el.textContent='Five is the most — deselect one to swap.';
  clearTimeout(sportHintT);
  sportHintT=setTimeout(()=>{const e=document.getElementById('sportLead');if(e)e.textContent=SPORT_LEAD;},2600);
}
function setSport(sp){
  const i=S.sports.indexOf(sp);
  if(i>-1)S.sports.splice(i,1);
  else if(S.sports.length<MAX_SPORTS)S.sports.push(sp);
  else {sportHint();return;}
  rebuildStack();
  const box=document.getElementById('sportList');
  if(box)box.innerHTML=sportRows();
  syncSportBtn();
}
function syncSportBtn(){
  const b=document.getElementById('sportBtn');
  if(!b)return;
  const n=S.sports.length;
  b.disabled=!n;
  b.textContent=!n?'Pick an activity':(n===1?'Continue with '+S.sports[0]:'Continue with '+n+' activities');
}
function vSport(){
  return '<div class="body rise">'+
    '<h1 class="hd">Which activity?</h1>'+
    '<p class="lead" id="sportLead">'+SPORT_LEAD+'</p>'+
    '<div style="display:flex;align-items:center;gap:9px;background:var(--cream);border:1px solid var(--hair);border-radius:12px;padding:11px 14px;margin:18px 0 12px">'+
      I('search','#9E9A94',18)+
      '<input id="sportSearch" value="'+(S.sportQuery||'').replace(/"/g,'&quot;')+'" oninput="filterSports(this.value)" placeholder="Search activities" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:15px;color:var(--cocoa);font-family:inherit" />'+
    '</div>'+
    '<div id="sportList" style="display:flex;flex-direction:column;gap:9px;padding-bottom:12px">'+sportRows()+'</div>'+
  '</div>'+
  '<div class="footer"><button id="sportBtn" class="primary" '+(S.sports.length?'':'disabled')+' onclick="next()">'+(!S.sports.length?'Pick an activity':(S.sports.length===1?'Continue with '+S.sports[0]:'Continue with '+S.sports.length+' activities'))+'</button></div>';
}

const VIEWS={welcome:vWelcome,goal:vGoal,sport:vSport,build:vBuild,plan:vPlan,sleeptimes:vSleepTimes,about:vAbout,health:vHealth,notify:vNotify,account:vAccount,signup:vSignup,trial:vTrial,ready:vReady};
/* the bar counts only the steps this run will actually show, so skipping the
   activity step no longer produces a 12.5% -> 50% jump */
/* Only the goal decides which steps the bar counts. The sign-in route isn't
   known until the account screen, so its optional steps always count;
   otherwise choosing email would move the bar backwards. */
function progressSteps(){
  return STEPS.filter(s=>!(s==='sport'&&skipSport())&&!(s==='sleeptimes'&&!sleepTimesNeeded()));
}
function progressPct(){
  const vis=progressSteps(), i=vis.indexOf(STEPS[S.step]);
  return i<=0?0:(i/(vis.length-1)*100);
}
function render(){
  const id=STEPS[S.step];
  /* no way back out of a created account, so 'ready' carries no header */
  const prog=(S.step>0&&id!=='ready')?'<div class="prog"><button class="bk" onclick="back()" aria-label="Back">‹</button>'+
    '<div class="track"><div class="fill" style="width:'+progressPct()+'%"></div></div><div style="width:44px"></div></div>':'';
  document.getElementById('phone').innerHTML=prog+VIEWS[id]();
  if(id==='build')startBuild();
}
render();
</script>
</body>
</html>
